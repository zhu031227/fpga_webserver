<meta charset='UTF-8'><html><head><title>Local Config</title><style>body{font-family:Arial;margin:20px;}h3{color:#2196F3;}.row{margin:8px 0;}label{display:inline-block;width:80px;font-size:14px;}input{padding:5px;font-size:14px;width:180px;}button{padding:6px 14px;margin:4px;font-size:14px;cursor:pointer;}.btn-save{background:#4CAF50;color:#fff;border:none;}.btn-back{background:#888;color:#fff;border:none;}.tip{font-size:12px;color:#888;margin-top:15px;line-height:1.6;}</style></head><body><h3>本机网络配置</h3><div class='row'><label>MAC 地址:</label><input id='mac' placeholder='00:00:01:02:04:06'></div><div class='row'><label>IP 地址:</label><input id='ip' placeholder='192.168.1.88'></div><div class='row'><label>子网掩码:</label><input id='netmask' placeholder='255.255.255.0'></div><div class='row'><label>网关地址:</label><input id='gateway' placeholder='192.168.1.1'></div><div style='margin-top:15px;'><button class='btn-save' onclick='saveCfg()'>保存配置</button><button class='btn-back' onclick="location='/'">返回首页</button></div><div class='tip'>提示:<br>* 修改 IP 后需要用新 IP 重新访问本页面<br>* 配置保存到 Flash，断电不丢失<br>* MAC 格式: XX:XX:XX:XX:XX:XX<br>* IP 格式: XXX.XXX.XXX.XXX</div><script>function macToStr(mh,ml){let m=[];m[0]=(mh>>8)&0xFF;m[1]=mh&0xFF;m[2]=(ml>>24)&0xFF;m[3]=(ml>>16)&0xFF;m[4]=(ml>>8)&0xFF;m[5]=ml&0xFF;return m.map(b=>(b<16?'0':'')+b.toString(16).toUpperCase()).join(':');}function ipToStr(ip){return ((ip>>24)&0xFF)+'.'+((ip>>16)&0xFF)+'.'+((ip>>8)&0xFF)+'.'+(ip&0xFF);}function loadCfg(){fetch('/api/local/status').then(r=>r.json()).then(j=>{document.getElementById('mac').value=j.mac;document.getElementById('ip').value=j.ip;document.getElementById('netmask').value=j.netmask;document.getElementById('gateway').value=j.gateway;});}function saveCfg(){fetch('/api/local/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mac:document.getElementById('mac').value,ip:document.getElementById('ip').value,netmask:document.getElementById('netmask').value,gateway:document.getElementById('gateway').value})}).then(r=>r.json()).then(j=>{alert(j.msg);});}loadCfg();</script></body></html>
