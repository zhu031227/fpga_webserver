<meta charset='UTF-8'><html><head><title>MAC Whitelist</title><style>body{font-family:Arial;margin:20px;}h3{color:#2196F3;}.bar{background:#f0f0f0;padding:10px;margin-bottom:10px;font-size:13px;}input{padding:5px;margin:2px;font-size:14px;}button{padding:6px 12px;margin:3px;font-size:14px;cursor:pointer;}table{border-collapse:collapse;width:100%;margin-top:10px;}th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:13px;}th{background:#2196F3;color:#fff;}.btn-del{background:#f44336;color:#fff;border:none;padding:4px 8px;cursor:pointer;}.btn-save{background:#4CAF50;color:#fff;border:none;padding:6px 14px;}.btn-back{background:#888;color:#fff;border:none;padding:6px 14px;}</style></head><body><h3>MAC 白名单配置</h3><div class='bar'>白名单: <span id='wlState'>--</span> | 条目: <span id='wlCount'>--</span> | 默认策略: <span id='dpState'>--</span> | 查找模式: BRAM顺序</div><div><button onclick='toggleWL()' id='btnToggle'>启用/禁用</button><button onclick='toggleDefPass()' id='btnDefPass'>切换默认策略</button></div><div style='margin:10px 0;'><input id='macInput' placeholder='XX:XX:XX:XX:XX:XX' style='width:200px;'><button onclick='addMAC()'>添加</button></div><table><thead><tr><th>#</th><th>MAC 地址</th><th>状态</th><th>操作</th></tr></thead><tbody id='wlTable'></tbody></table><div style='margin-top:10px;'><button class='btn-save' onclick='clearAll()'>清空全部</button><button class='btn-save' onclick='saveWL()'>保存到Flash</button><button class='btn-back' onclick="location='/'">返回首页</button></div><script>function loadStatus(){fetch('/api/wl/status').then(r=>r.json()).then(j=>{document.getElementById('wlState').innerText=j.enabled?'已启用':'已禁用';document.getElementById('dpState').innerText=j.defpass?'全放':'全断';document.getElementById('wlCount').innerText=j.used+'/'+j.max;});}function loadList(){fetch('/api/wl/list').then(r=>r.json()).then(j=>{let t=document.getElementById('wlTable');t.innerHTML='';j.forEach((e,i)=>{t.innerHTML+='<tr><td>'+e.idx+'</td><td>'+e.mac+'</td><td>'+(e.valid?'有效':'--')+'</td><td><button class=btn-del onclick=delMAC('+e.idx+')>删除</button></td></tr>';});});}function addMAC(){let m=document.getElementById('macInput').value;fetch('/api/wl/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mac:m})}).then(r=>r.json()).then(j=>{alert(j.msg);loadList();loadStatus();});}function delMAC(i){fetch('/api/wl/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:''+i})}).then(r=>r.json()).then(j=>{alert(j.msg);loadList();loadStatus();});}function clearAll(){if(confirm('清空全部白名单?')){fetch('/api/wl/clear',{method:'POST'}).then(r=>r.json()).then(j=>{alert(j.msg);loadList();loadStatus();});}}function toggleWL(){fetch('/api/wl/toggle',{method:'POST'}).then(r=>r.json()).then(j=>{alert(j.msg);loadStatus();});}function toggleDefPass(){fetch('/api/wl/defpass',{method:'POST'}).then(r=>r.json()).then(j=>{alert(j.msg);loadStatus();});}function saveWL(){fetch('/api/wl/save',{method:'POST'}).then(r=>r.json()).then(j=>{alert(j.msg);});}loadStatus();loadList();</script></body></html>
